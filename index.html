let slotKind41='all';
function nextDocumentNo41(date,prefix='R'){if(prefix==='R')prefix=S.settings.receipt_prefix||'R';let n=Number(localStorage.getItem('xuanyun-document-seq41')||0);for(const p of S.payments){const m=p.document_no?.match(/-(\d+)$/);if(m)n=Math.max(n,Number(m[1]))}n++;localStorage.setItem('xuanyun-document-seq41',String(n));return prefix+date.replaceAll('-','').slice(2)+'-'+String(n).padStart(5,'0')}
function documentNo41(p){if(p.document_no)return p.document_no;if(S.mode==='demo'){p.document_no=nextDocumentNo41(p.payment_date,p.amount<0?'F':p.order_kind==='expense'?'E':'R');saveLocal();return p.document_no}return p.receipt_no}
function slotsPage(){const cs=S.catalog.filter(c=>c.kind==='light'&&c.state!=='archived'),all=S.slots.filter(sl=>cs.some(c=>c.id===sl.catalog_id)),selected=cs.some(c=>c.id===slotKind41)?slotKind41:'all',rows=all.filter(sl=>(selected==='all'||sl.catalog_id===selected)&&(slotFilter==='all'||(slotFilter==='empty'?!sl.order_id:!!sl.order_id)));return pageTitle('燈位管理','依燈種分區查看；確認點燈結束後，才讓燈位恢復可用。','<button class="btn primary" onclick="openAddSlots()">新增空燈位</button>')+'<div class="cards">'+stat('燈位總數',all.length+' 位','所有啟用燈種','fire')+stat('可用空位',all.filter(sl=>!sl.order_id).length+' 位','可供新點燈登記','check')+stat('使用中',all.filter(sl=>sl.order_id).length+' 位','包含未付款登記','users')+'</div><div class="toolbar wrap"><label>燈種 <select id="slotKind41" onchange="slotKind41=this.value;render()"><option value="all">全部燈種（分區顯示）</option>'+cs.map(c=>'<option value="'+esc(c.id)+'" '+(selected===c.id?'selected':'')+'>'+esc(c.title)+'</option>').join('')+'</select></label><label>燈位狀態 <select onchange="slotFilter=this.value;render()"><option value="all" '+(slotFilter==='all'?'selected':'')+'>全部</option><option value="empty" '+(slotFilter==='empty'?'selected':'')+'>可用空位</option><option value="used" '+(slotFilter==='used'?'selected':'')+'>使用中</option></select></label></div>'+((selected==='all'?cs:cs.filter(c=>c.id===selected)).map((c,i)=>{const slots=rows.filter(sl=>sl.catalog_id===c.id),total=all.filter(sl=>sl.catalog_id===c.id),used=total.filter(sl=>sl.order_id).length;return '<details class="slotGroup41" '+(selected!=='all'||i===0?'open':'')+'><summary><strong>'+esc(c.title)+'</strong><span>'+total.length+' 位 · 使用 '+used+' · 空位 '+(total.length-used)+' · 本次顯示 '+slots.length+' 位</span></summary><div class="slotGrid41">'+slots.map(sl=>{const o=order(sl.order_id);return '<article class="slotCard41 '+(sl.order_id?'occupied41':'')+'"><strong>'+esc(sl.slot_no)+'</strong><div>'+esc(o?.person_name||(sl.order_id?'登記待讀取':'可用空位'))+'</div><div class="muted small">'+(o?'到期：'+esc(o.payload?.expiry_date||'未設定'):'可供登記點燈')+'</div>'+(o?badge(o):'<span class="chip green">'+(sl.order_id?'請重新讀取':'空位')+'</span>')+'<div class="flex wrap">'+(o?'<button class="btn sm" onclick="viewOrder(\''+o.id+'\')">查看登記</button><button class="btn sm" onclick="releaseLamp(\''+o.id+'\')">結束點燈</button>':!sl.order_id?'<button class="btn sm" onclick="openSlotEdit(\''+sl.id+'\')">編輯／刪除</button>':'')+'</div></article>'}).join('')+'</div>'+(slots.length?'':'<p class="muted" style="padding:18px">此燈種沒有符合的燈位。</p>')+'</details>'}).join('')||( '<div class="panel">'+empty('尚未建立燈種','先建立燈種與空燈位。','fire')+'</div>'))}
function releaseLamp(id){if(busy)return;const o=order(id);if(!o||o.kind!=='light'||o.state!=='active'||o.inventory_state!=='reserved')return toast('此點燈已結束或不是有效登記，請重新讀取');openModal('結束點燈，釋出燈位','<div class="banner">請確認實體燈卡已取下，這次點燈服務確實結束。</div><div class="panel" style="margin-top:16px"><h3>'+esc(o.person_name)+' · '+esc(o.title)+'</h3><p>燈位：'+esc(o.payload?.position||'未指定')+'</p><p>已收：'+money(paid(o))+' · 未收：'+money(remaining(o))+'</p></div><p style="margin-top:18px">確認後，燈位可安排給下一位。原登記與收款保留，尚未收到的款項仍列待收。</p><p class="muted" style="margin-top:12px">若只是輸入錯誤、要取消報名，請使用登記內的「刪除／取消登記」。</p>','<button class="btn" onclick="closeModal()">返回，不釋出</button><button class="btn primary" onclick="confirmRelease41(\''+id+'\')">確認結束並釋出</button>')}
function deletePayment(id){if(busy)return;const p=S.payments.find(x=>x.id===id);if(!p||p.status!=='active')return toast('此筆已撤銷或已更正');if(p.amount>0&&activePayments().some(r=>r.refund_of===id))return toast('原款已有退款，請先撤銷錯誤的退款紀錄');openModal('撤銷錯誤收付款','<div class="banner">僅用於輸入錯誤。若錢確實收過、後來退回，請使用「退款」。</div><p style="margin:16px 0">'+esc(documentNo41(p))+' · '+esc(p.document_name)+' · '+money(Math.abs(p.amount))+'<br>實際日期：'+esc(p.payment_date)+'</p>'+textField('撤銷原因 *','voidReason41','')+'<p class="muted" style="margin-top:14px">撤銷後不再計入收支，原紀錄及原因仍保留。</p>','<button class="btn" onclick="closeModal()">返回，不撤銷</button><button class="btn primary" onclick="confirmVoid41(\''+id+'\')">確認撤銷</button>')}

function confirmPrinted(type){if(busy)return;const ids=selectedDocs();if(!ids.length)return toast('請先勾選下方要確認的字卡／疏文');const invalid=ids.filter(id=>{const o=order(id),d=o&&docRecord(o,type);return !o||o.state!=='active'||!d||!['exported','printed'].includes(d.status)});if(invalid.length)return toast('選取的 '+invalid.length+' 筆尚未匯出最新 CSV。請先按「匯出選取 CSV」，紙本印好後再確認。');pendingPrint42={type,ids:[...ids],revisions:Object.fromEntries(ids.map(id=>[id,order(id).revision||1])),catalogRevisions:Object.fromEntries(ids.map(id=>[id,S.catalog.find(c=>c.id===order(id).catalog_id)?.revision||1]))};openModal('確認紙本已列印','<div class="banner">請確認下列 '+ids.length+' 筆'+(type==='lamp'?'點燈字卡':'法會疏文')+'的紙本已經印好。</div><div class="printConfirmList42">'+ids.map(id=>{const o=order(id);return '<div class="kv"><strong>'+esc(o.person_name)+'</strong><span>'+esc(o.title)+' · '+esc(type==='lamp'?o.payload?.position||'未分配':docRow(o).service||'')+'</span></div>'}).join('')+'</div><p style="margin-top:16px">確認後會移出「待處理」清單，可在「已確認列印」查詢或重印。收付款不受影響。</p>','<button class="btn" onclick="pendingPrint42=null;closeModal()">返回，尚未印好</button><button class="btn primary" onclick="savePrinted42()">確認這 '+ids.length+' 筆已印好</button>')}
async function savePrinted42(){if(busy||!pendingPrint42)return;const job=pendingPrint42;busy=true;try{for(const id of job.ids){const o=order(id),d=o&&docRecord(o,job.type),cr=S.catalog.find(c=>c.id===o?.catalog_id)?.revision||1;if(!o||o.state!=='active'||(o.revision||1)!==job.revisions[id]||cr!==job.catalogRevisions[id]||!d||!['exported','printed'].includes(d.status))throw Error('資料已變更，請返回並重新匯出最新 CSV')}await updateDocumentStatus(job.ids,job.type,'print');pendingPrint42=null;busy=false;closeModal();render();toast('已確認 '+job.ids.length+' 筆列印，可在「已確認列印」查看')}catch(e){toast('確認失敗：'+e.message)}finally{busy=false}}

document.addEventListener('keydown',e=>{if($('deleteConfirm43'))return;if(e.key==='Escape'){closeModal();toggleSidebar(false)}if(e.key==='Tab'&&$('modalBack').classList.contains('show')){const nodes=[...$('modalBack').querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled);if(!nodes.length)return;const a=nodes[0],b=nodes.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}}});
function download(text,name,type='application/json'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function login(){try{if(!db)initClient();$('loginMessage').textContent='前往 Google 登入…';if(location.protocol==='file:')throw Error('Google 登入需要網站網址。請將 HTML 放到原本網站，或開啟新版網站並在 Supabase 加入該網址的登入回跳設定。');const redirect=location.origin+location.pathname;const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirect}});if(error)throw error}catch(e){$('loginMessage').textContent=e.message;toast(e.message)}}
async function allRows(table,order='created_at'){let rows=[];for(let start=0;;start+=500){let q=db.from(table).select('*').order(order,{ascending:true}).order('id',{ascending:true}).range(start,start+499);const r=await q;if(r.error)throw Error(table+'：'+r.error.message);rows.push(...r.data);if(r.data.length<500)break}return rows}

function calendar(){const [y,m]=S.month.split('-').map(Number),first=new Date(y,m-1,1),start=new Date(y,m-1,1-first.getDay());let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const es=S.events.filter(e=>e.start_date<=ds&&(e.end_date||e.start_date)>=ds);cells+='<div class="day '+(d.getMonth()!==m-1?'out ':'')+(ds===today()?'today':'')+'" role="button" tabindex="0" onclick="selectDay(\''+ds+'\')" onkeydown="if(event.key===\'Enter\')selectDay(\''+ds+'\')" aria-label="'+ds+' '+es.length+'項宮務"><span class="daynum">'+d.getDate()+'</span><span class="daylunar">'+esc(safeLunar(ds).short)+'</span>'+es.slice(0,3).map(e=>'<div class="ev '+(e.event_type==='orange'?'orange':'')+'">'+esc(e.title)+'</div>').join('')+(es.length>3?'<div class="small muted">+'+(es.length-3)+'</div>':'')+'</div>'}return pageTitle('宮務行事曆','保留原有活動 · 國曆與農曆同步顯示','<button class="btn primary" onclick="openEvent()">'+icon('plus')+'新增宮務</button>')+'<div class="panel"><div class="flex between wrap" style="margin-bottom:20px"><h2>'+y+' 年 '+m+' 月</h2><div class="monthtools"><button class="btn sm" onclick="changeMonth(-1)">‹</button><button class="btn sm" onclick="calendarNow()">今天</button><button class="btn sm" onclick="changeMonth(1)">›</button></div></div><div class="calendar">'+['日','一','二','三','四','五','六'].map(x=>'<div class="dow">週'+x+'</div>').join('')+cells+'</div></div><div class="panel" id="dayPanel">'+dayPanel()+'</div>'}

function normalizeMonth(v){return v.replace(/月/g,'').replace('冬','十一').replace('臘','十二').replace('腊','十二').replace('正','一')}
function lunarTextToSolar(text){let t=text.trim(),year,month,day;const m=t.match(/^(民國|西元)?\s*(\d{2,4})\s*年\s*(閏?[正一二三四五六七八九十冬臘\d]+)月\s*(初[一二三四五六七八九十]|十[一二三四五六七八九]?|二十|廿[一二三四五六七八九]?|三十|\d{1,2})$/);if(!m)throw Error('農曆請填完整年份，例如：民國115年正月初一');year=Number(m[2])+(m[1]==='民國'||(!m[1]&&Number(m[2])<1912)?1911:0);month=normalizeMonth(m[3]);const nums={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10};if(/^\d+$/.test(month)){const nm=['','一','二','三','四','五','六','七','八','九','十','十一','十二'][Number(month)];month=nm||month}const dt=m[4];day=/^\d+$/.test(dt)?Number(dt):dt==='三十'?30:dt==='二十'||dt==='廿'?20:dt.startsWith('初')?nums[dt.slice(1)]:dt.startsWith('廿')?20+nums[dt.slice(1)]:dt==='十'?10:10+nums[dt.slice(1)];if(year<1900||year>2100||!day||day>30)throw Error('農曆年份或日期不正確');for(let i=0;i<425;i++){const d=new Date(Date.UTC(year,0,1+i,4)),ds=d.toISOString().slice(0,10),l=lunar(ds);if(l.year===year&&normalizeMonth(l.month)===month&&l.day===day)return ds}throw Error('找不到此農曆日期，請確認年份、閏月及日期')}
